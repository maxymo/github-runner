services:
  github-runner:
    image: myoung34/github-runner:latest
    restart: always
    environment:
      REPO_URL: https://github.com/maxymo/nexus
      RUNNER_SCOPE: repo
      ACCESS_TOKEN: ${GH_PAT}
      RUNNER_NAME_PREFIX: homelab
      RANDOM_RUNNER_SUFFIX: "true"
      LABELS: testing
      EPHEMERAL: "true"
      RUNNER_WORKDIR: /tmp/runner/work
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/runner:/tmp/runner
